<script>// Answer comparison. One rule per answer kind. No DOM access.
//
// This started as a copy of geometry-10/src/checker.js. Four rules are new for
// Test #2, and each exists because the study guide asks for something Test #1
// never did:
//   * pairs with non-integer components  -- the midpoint of two odd coordinates
//   * decimal3                            -- "round to the nearest thousandths"
//   * segment                             -- DE and ED name the same segment
//   * angle                               -- the student may or may not type the angle sign
(function () {
  // Students type the unicode minus from a worksheet as often as a hyphen.
  function normalize(text) {
    return String(text == null ? '' : text)
      .replace(/−/g, '-')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }

  function parseInteger(text) {
    var s = normalize(text);
    return /^[+-]?\d+$/.test(s) ? parseInt(s, 10) : null;
  }

  function parseFraction(text) {
    var s = normalize(text);
    var m = s.match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);
    if (m) {
      var den = parseInt(m[2], 10);
      if (den === 0) return null;
      return { num: parseInt(m[1], 10), den: den };
    }
    var whole = parseInteger(s);
    return whole === null ? null : { num: whole, den: 1 };
  }

  function reduce(f) {
    var g = gcd(f.num, f.den);
    var num = f.num / g, den = f.den / g;
    if (den < 0) { num = -num; den = -den; }
    return { num: num, den: den };
  }

  // Everything parseFraction reads, plus decimals. Kept separate from
  // parseFraction so the 'fraction' kind keeps rejecting decimals: there,
  // "write it as a fraction" is the instruction being graded.
  function parseNumber(text) {
    var s = normalize(text);
    var m = s.match(/^([+-]?)(\d*)\.(\d+)$/);
    if (m) {
      var digits = m[3];
      var whole = m[2] === '' ? 0 : parseInt(m[2], 10);
      var den = Math.pow(10, digits.length);
      var num = whole * den + parseInt(digits, 10);
      return reduce({ num: m[1] === '-' ? -num : num, den: den });
    }
    var f = parseFraction(s);
    return f === null ? null : reduce(f);
  }

  function isReduced(f) {
    return gcd(f.num, f.den) === 1 && f.den > 0;
  }

  function sameValue(a, b) { return a.num * b.den === b.num * a.den; }

  // A midpoint lands on a half whenever the two coordinates differ in parity,
  // so components go through parseNumber rather than parseInteger. Both
  // (-1.5, -2) and (-3/2, -2) are the same answer and both are accepted.
  function parsePair(text) {
    var s = normalize(text).replace(/^\(|\)$/g, '');
    var parts = s.split(',');
    if (parts.length !== 2) return null;
    var x = parseNumber(parts[0]), y = parseNumber(parts[1]);
    return (x === null || y === null) ? null : { x: x, y: y };
  }

  function checkPair(text, spec) {
    var p = parsePair(text);
    if (p === null) return { status: 'malformed' };
    return { status: (sameValue(p.x, spec.x) && sameValue(p.y, spec.y))
                     ? 'correct' : 'wrong' };
  }

  // Type 7 demands exactly two decimal places -- "15.8" is not an answer
  // rounded to hundredths, it is an answer rounded to tenths.
  function checkDecimal2(text, spec) {
    var s = normalize(text);
    if (!/^[+-]?\d+(\.\d+)?$/.test(s)) return { status: 'malformed' };
    if (!/^[+-]?\d+\.\d{2}$/.test(s)) return { status: 'needs-hundredths' };
    return { status: parseFloat(s) === spec.value ? 'correct' : 'wrong' };
  }

  // Same discipline one place further out, for the distance formula.
  function checkDecimal3(text, spec) {
    var s = normalize(text);
    if (!/^[+-]?\d+(\.\d+)?$/.test(s)) return { status: 'malformed' };
    if (!/^[+-]?\d+\.\d{3}$/.test(s)) return { status: 'needs-thousandths' };
    return { status: parseFloat(s) === spec.value ? 'correct' : 'wrong' };
  }

  function parseRadical(text) {
    var s = normalize(text).toLowerCase()
      .replace(/√/g, ' sqrt ')
      .replace(/\bsqrt\b/g, ' sqrt ')
      .replace(/(\d)\s*r\s*(\d)/g, '$1 sqrt $2')
      .replace(/^\s*r\s*(\d)/, ' sqrt $1')
      .replace(/\s+/g, ' ')
      .trim();
    var m = s.match(/^(\d*)\s*sqrt\s*(\d+)$/);
    if (!m) return null;
    return { coef: m[1] === '' ? 1 : parseInt(m[1], 10), rad: parseInt(m[2], 10) };
  }

  function checkRadical(text, spec) {
    var s = normalize(text);
    // A bare decimal means the calculator button was used -- explicitly banned.
    if (/^[+-]?\d+\.\d+$/.test(s)) return { status: 'needs-exact' };
    var r = parseRadical(s);
    if (r === null) return { status: 'malformed' };
    return { status: (r.coef === spec.coef && r.rad === spec.rad) ? 'correct' : 'wrong' };
  }

  // Operation notation: a keyboard has no ÷ or ×, so accept what it offers.
  function normalizeOp(text) {
    return normalize(text).toLowerCase()
      .replace(/\s+/g, '')
      .replace(/[*x]/g, '×')
      .replace(/\//g, '÷');
  }

  function checkOp(text, spec) {
    var s = normalizeOp(text);
    if (s === '') return { status: 'malformed' };
    return { status: s === spec.value ? 'correct' : 'wrong' };
  }

  function checkSigns(text, spec) {
    var s = normalize(text).replace(/[()\s]/g, '');
    var parts = s.split(',');
    if (parts.length !== 2 || !/^[+-]$/.test(parts[0]) || !/^[+-]$/.test(parts[1])) {
      return { status: 'malformed' };
    }
    return { status: (parts[0] === spec.x && parts[1] === spec.y) ? 'correct' : 'wrong' };
  }

  function labelKey(v) {
    return normalize(v).toLowerCase().replace(/[\s-]+/g, '');
  }

  function checkLabel(text, spec) {
    var s = labelKey(text);
    if (s === '') return { status: 'malformed' };
    return { status: s === labelKey(spec.value) ? 'correct' : 'wrong' };
  }

  // A segment has no direction: DE and ED are the same segment, and the
  // congruency statements on the study guide are written both ways on the
  // same page. Sorting the endpoints is the whole rule.
  function segmentKey(v) {
    var s = normalize(v).toUpperCase().replace(/[^A-Z]/g, '');
    return s.split('').sort().join('');
  }

  function checkSegment(text, spec) {
    var s = segmentKey(text);
    if (s.length !== 2) return { status: 'malformed' };
    return { status: s === segmentKey(spec.value) ? 'correct' : 'wrong' };
  }

  // The angle sign is a nuisance to type, so ∠DEF, <DEF, "angle DEF" and a
  // bare DEF are all the same entry. Letter ORDER still matters: naming an
  // angle by three points is exactly the skill being graded, and the question
  // says which endpoint to list first.
  //
  // The "m" of "m∠ABC" is only dropped while the sign is still attached. A
  // bare leading m is a vertex named M -- stripping it after the sign was
  // removed turned ∠M into the empty string, which graded as malformed, and a
  // malformed answer costs no attempt: that blank could never be passed. It is
  // the third statement of the study guide's own congruence problem.
  function angleKey(v) {
    return normalize(v).toLowerCase()
      .replace(/^m(?=∠|<)/, '')
      .replace(/∠/g, '').replace(/</g, '')
      .replace(/\bangle\b/g, '')
      .replace(/[\s.]+/g, '');
  }

  function checkAngle(text, spec) {
    var s = angleKey(text);
    if (s === '') return { status: 'malformed' };
    return { status: s === angleKey(spec.value) ? 'correct' : 'wrong' };
  }

  function checkAnswer(text, spec) {
    if (spec.kind === 'int') {
      var n = parseInteger(text);
      if (n === null) {
        // An integer written to a rounding place is still that integer:
        // a distance of exactly 15 may be handed in as 15.000.
        var f = parseNumber(text);
        if (f === null) return { status: 'malformed' };
        // A readable number that is not a whole number is a wrong answer,
        // not an unreadable one -- saying "that is not a number" about 15.001
        // sends the student looking for a typo instead of for the mistake.
        if (f.den !== 1) return { status: 'wrong' };
        n = f.num;
      }
      return { status: n === spec.value ? 'correct' : 'wrong' };
    }
    if (spec.kind === 'fraction') {
      var fr = parseFraction(text);
      if (fr === null) return { status: 'malformed' };
      if (!sameValue(fr, spec)) return { status: 'wrong' };
      return { status: isReduced(fr) ? 'correct' : 'unreduced' };
    }
    if (spec.kind === 'pair') return checkPair(text, spec);
    if (spec.kind === 'op') return checkOp(text, spec);
    if (spec.kind === 'decimal2') return checkDecimal2(text, spec);
    if (spec.kind === 'decimal3') return checkDecimal3(text, spec);
    if (spec.kind === 'radical') return checkRadical(text, spec);
    if (spec.kind === 'signs') return checkSigns(text, spec);
    if (spec.kind === 'segment') return checkSegment(text, spec);
    if (spec.kind === 'angle') return checkAngle(text, spec);
    if (spec.kind === 'label') return checkLabel(text, spec);
    throw new Error('unknown answer kind: ' + spec.kind);
  }

  // A step blank declares a plain value; its grading rule is inferred from
  // the shape of that value, so problem data stays free of type tags.
  function blankSpec(value) {
    if (typeof value === 'number') return { kind: 'int', value: value };
    var s = normalize(value);
    if (s.indexOf(',') !== -1) {
      var pr = parsePair(s);
      if (pr) return { kind: 'pair', x: pr.x, y: pr.y };
      var q = s.replace(/[()\s]/g, '').split(',');
      if (q.length === 2 && /^[+-]$/.test(q[0]) && /^[+-]$/.test(q[1])) {
        return { kind: 'signs', x: q[0], y: q[1] };
      }
      return { kind: 'label', value: s };
    }
    if (/^[×÷*\/]/.test(s)) return { kind: 'op', value: normalizeOp(s) };
    // Anything carrying the angle sign is an angle name, including ∠5.
    if (s.indexOf('∠') !== -1) return { kind: 'angle', value: s };
    // Two bare capitals name a segment; a single letter or a word does not.
    if (/^[A-Z]{2}$/.test(s)) return { kind: 'segment', value: s };
    var r = parseRadical(s);
    if (r) return { kind: 'radical', coef: r.coef, rad: r.rad };
    if (s.indexOf('/') !== -1) {
      var f = parseFraction(s);
      if (f) return { kind: 'fraction', num: f.num, den: f.den };
    }
    if (/^[+-]?\d+\.\d{3}$/.test(s)) return { kind: 'decimal3', value: parseFloat(s) };
    if (/^[+-]?\d+\.\d+$/.test(s)) return { kind: 'decimal2', value: parseFloat(s) };
    if (/^[+-]?\d+$/.test(s)) return { kind: 'int', value: parseInt(s, 10) };
    if (/^[+-]\d+[a-z]$/i.test(s)) return { kind: 'op', value: normalizeOp(s) };
    return { kind: 'label', value: s };
  }

  // How a pair component reads back on the review screen. Halves are the only
  // fractions a midpoint produces, and -1.5 is how the worksheet writes one.
  function fractionText(f) {
    if (f.den === 1) return String(f.num);
    if (f.den === 2 || f.den === 4 || f.den === 5 || f.den === 10) {
      return String(f.num / f.den);
    }
    return f.num + '/' + f.den;
  }

  globalThis.checkAnswer = checkAnswer;
  globalThis.gcd = gcd;
  globalThis.parseFraction = parseFraction;
  globalThis.parseNumber = parseNumber;
  globalThis.blankSpec = blankSpec;
  globalThis.fractionText = fractionText;
})();

// The study guide problems, as data.
//
// UNLIKE Test #1, THERE IS NO TEACHER ANSWER KEY FOR THIS TEST. reference/
// holds two scans of the same worksheet -- the second one ("Part 2") is the
// same nine questions after corrections, not a new assignment. Every answer
// here was derived independently from the printed question, and each problem
// carries a `verify` that recomputes it from the figure's own numbers. If an
// answer looks wrong, re-derive it -- do NOT "correct" it against handwriting.
//
// The corrected scan CONFIRMS all three answers that had to be derived:
//   * Q5 asks for the MIDPOINT. The first scan re-ran the distance formula;
//     the corrected one works the midpoint formula and reaches (−1.5, −2),
//     which is what this file already said.
//   * Q3 solves to x = 5. The first scan showed a struck-out x = 1.
//   * Q8's correspondence is D↔L, E↔K, C↔M. Both scans agree, and the
//     corrected one writes the sides as LK, ML and MK -- the same three
//     segments this file names as LK, LM and KM. A segment has no direction,
//     so both orders are accepted; see checker.js.
//   * The Part I vocabulary blanks 1a and 1f were swapped on the first scan
//     and are corrected on the second, to Segment and Collinear respectively.
//     Those live in geometry-10-t2-vocab, not here.
(function () {
  // A chain is trustworthy only if its last step lands exactly on the
  // declared answer. Anything else means the transcription drifted.
  function walkProblem(p) {
    if (!p.steps || p.steps.length === 0) {
      return { ok: false, error: 'no steps' };
    }
    var last = p.steps[p.steps.length - 1];
    var keys = Object.keys(last.blanks);
    if (keys.length === 0) {
      return { ok: false, error: 'final step has no blank' };
    }
    // Steps may carry operation blanks before the result; the answer is the
    // last blank filled, not the only one.
    var final = last.blanks[keys[keys.length - 1]];
    var result = checkAnswer(String(final), p.answer);
    if (result.status !== 'correct') {
      return { ok: false, error: 'final blank ' + final + ' is ' + result.status };
    }
    return { ok: true, error: '' };
  }

  // Scalar answers verify against a bare number; every other kind needs the
  // whole spec, since its value lives in several fields.
  function verifyArg(answer) {
    var scalar = answer.kind === 'int' || answer.kind === 'decimal2' ||
                 answer.kind === 'decimal3';
    return scalar ? answer.value : answer;
  }

  // The classification rule itself, written once. Problems verify their
  // declared label against the degrees actually drawn in their figure, so a
  // figure and its answer cannot drift apart.
  function classify(deg) {
    if (deg === 180) return 'straight angle';
    if (deg === 90) return 'right angle';
    return deg < 90 ? 'acute angle' : 'obtuse angle';
  }

  var PROBLEMS = [
    // ---- Type: Segment Addition Postulate (Part II #3)
    { id: 'sg2-3', type: 'segment-addition', source: 'SG2 #3',
      prompt: 'Use the figure to write an equation with the Segment Addition Postulate, then solve for x.',
      figure: { shape: 'segment', names: ['K', 'L', 'M'], at: 0.45,
                left: '2x − 2', right: '2x − 7', total: '11' },
      answer: { kind: 'int', value: 5 },
      verify: function (x) { return (2 * x - 2) + (2 * x - 7) === 11; },
      steps: [
        { say: 'The two short pieces make the whole. Name the whole segment:',
          template: 'KL + LM = {a}', blanks: { a: 'KM' } },
        { say: 'Substitute the expressions and combine like terms:',
          template: '{a}x − {b} = 11', blanks: { a: 4, b: 9 } },
        { say: 'Add 9 to both sides:',
          template: '4x = {c}', blanks: { opL: '+9', opR: '+9', c: 20 } },
        { say: 'Divide both sides by 4:',
          template: 'x = {d}', blanks: { opL: '÷4', opR: '÷4', d: 5 } }
      ] },

    // ---- Type: distance formula (Part II #4)
    // A(3, −8), B(−6, 4). Δx = −9, Δy = 12, so d = √225 = 15 exactly.
    { id: 'sg2-4', type: 'distance', source: 'SG2 #4',
      prompt: 'Find the DISTANCE of the line segment from A (3, −8) to B (−6, 4). Round to the nearest thousandth if necessary.',
      answer: { kind: 'int', value: 15 },
      verify: function (d) {
        return d * d === (-6 - 3) * (-6 - 3) + (4 - -8) * (4 - -8);
      },
      steps: [
        { say: 'Subtract the x-coordinates, then the y-coordinates:',
          template: 'd = √( ({a})² + ({b})² )', blanks: { a: -9, b: 12 } },
        { say: 'Square each one. A negative squared is positive:',
          template: 'd = √( {c} + {d} )', blanks: { c: 81, d: 144 } },
        { say: 'Add what is under the radical:',
          template: 'd = √{e}', blanks: { e: 225 } },
        { say: 'Take the square root. This one comes out exact:',
          template: 'd = {f}', blanks: { f: 15 } }
      ] },

    // ---- Type: midpoint formula (Part II #5)
    // The worksheet answers this one with the distance formula. It asks for
    // the midpoint: ((3 + −6)/2, (−8 + 4)/2) = (−1.5, −2).
    { id: 'sg2-5', type: 'midpoint', source: 'SG2 #5',
      prompt: 'Find the MIDPOINT of the segment from A (3, −8) to B (−6, 4).',
      answer: blankSpec('(−1.5, −2)'),
      verify: function (m) {
        return (3 + -6) * m.x.den === 2 * m.x.num &&
               (-8 + 4) * m.y.den === 2 * m.y.num;
      },
      steps: [
        { say: 'Add the x-coordinates, then add the y-coordinates:',
          template: 'M = ( {a}/2 , {b}/2 )', blanks: { a: -3, b: -4 } },
        { say: 'Divide each sum by 2. Halves are fine — write it as a decimal:',
          template: 'M = {c}', blanks: { c: '(−1.5, −2)' } }
      ] },

    // ---- Type: naming an angle four ways (Part II #6)
    // Rays ED and EF from vertex E; the angle is numbered 5.
    { id: 'sg2-6', type: 'angle-naming', source: 'SG2 #6',
      prompt: 'Name the angle in 4 different ways.',
      figure: { shape: 'rays', vertex: 'E',
                rays: [{ deg: 90, label: 'F' }, { deg: -40, label: 'D' }],
                arcs: [{ from: 0, to: 1, label: '5' }] },
      answer: blankSpec('∠FED'),
      verify: function (a) {
        var s = String(a.value).replace('∠', '');
        return s.length === 3 && s.charAt(1) === 'E' &&
               s.charAt(0) === 'F' && s.charAt(2) === 'D';
      },

// Fresh problems in the same shape as the authored ones, so drilling a topic
// cannot decay into memorising the study guide. No DOM access.
//
// EVERY type in TYPES needs an entry in BY_TYPE. createDrill() calls
// generate() the moment the authored queue drains -- which is the first time
// a problem is missed -- and generate() throws on a type it does not know.
// A missing generator is not a gap, it is a crash mid-session.
(function () {
  var TYPES = ['segment-addition', 'distance', 'midpoint', 'angle-naming',
               'angle-classify', 'congruence', 'angle-addition', 'bisector'];

  // Mulberry32: small, fast, and deterministic across runs.
  function makeRng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The mark written under each side on paper: +1, -5, ÷4.
  function opMark(n) { return n < 0 ? '+' + (-n) : '-' + n; }
  function divMark(n) { return '÷' + n; }
  function undo(n) {
    return n < 0 ? 'Add ' + (-n) + ' to both sides:'
                 : 'Subtract ' + n + ' from both sides:';
  }

  function pick(rng, list) { return list[Math.floor(rng() * list.length)]; }
  function between(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
  function nonZero(rng, lo, hi) {
    var v = 0;
    while (v === 0) v = between(rng, lo, hi);
    return v;
  }
  // Worksheets write minus as U+2212, and the app should match.
  function sign(n) { return n < 0 ? '−' + Math.abs(n) : String(n); }
  function plus(n) { return n < 0 ? '− ' + Math.abs(n) : '+ ' + n; }

  // Distinct letters, so no figure ever labels two points the same.
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.split('');

      return !exclude || exclude.indexOf(c) === -1;

    for (var i = 0; i < count; i++) {

  // ---- Segment Addition Postulate: two pieces make the whole.
  function genSegmentAddition(rng) {
    var L = letters(rng, 3);
    var K = L[0], M = L[1], N = L[2];
    var x, a, c, b, d, kl, lm;
    // Both pieces are lengths, so both must come out positive.

      x = between(rng, 2, 12);
      a = between(rng, 1, 5); c = between(rng, 1, 5);
      b = between(rng, -12, 12); d = between(rng, -12, 12);

    } while (kl <= 0 || lm <= 0 || (b === 0 && d === 0));

    var coef = a + c, cons = b + d;
    var steps = [
      { say: 'The two short pieces make the whole. Name the whole segment:',
        template: K + M + ' + ' + M + N + ' = {a}', blanks: { a: K + N } },
      { say: 'Substitute the expressions and combine like terms:',
        template: cons === 0 ? '{a}x = ' + total
                             : (cons < 0 ? '{a}x − {b} = ' + total
                                         : '{a}x + {b} = ' + total),
        blanks: cons === 0 ? { a: coef } : { a: coef, b: Math.abs(cons) } }
    ];
    if (cons !== 0) {
      steps.push({ say: undo(cons), template: sign(coef) + 'x = {c}',
                   blanks: { opL: opMark(cons), opR: opMark(cons),
                             c: total - cons } });

    steps.push({ say: 'Divide both sides by ' + coef + ':', template: 'x = {d}',

      id: 'gen-segadd-' + K + M + N + '-' + a + '_' + b + '_' + c + '_' + d,
      type: 'segment-addition', source: 'generated',
      prompt: 'Use the figure to write an equation with the Segment Addition Postulate, then solve for x.',
      figure: { shape: 'segment', names: [K, M, N], at: 0.45,
                left: expr(a, b), right: expr(c, d), total: String(total) },
      answer: { kind: 'int', value: x },
      verify: function (v) { return (a * v + b) + (c * v + d) === total; },
      steps: steps

  function expr(a, b) {

  var TRIPLES = [[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15],
                 [8, 15, 17], [7, 24, 25], [12, 16, 20], [20, 21, 29]];

  function genDistance(rng) {
    var exact = rng() < 0.7;

    if (exact) {
      var t = pick(rng, TRIPLES);
      dx = t[0] * (rng() < 0.5 ? -1 : 1);
      dy = t[1] * (rng() < 0.5 ? -1 : 1);
      if (rng() < 0.5) { var sw = dx; dx = dy; dy = sw; }

      do {

      id: 'gen-dist-' + ax + '_' + ay + '_' + bx + '_' + by,
      type: 'distance', source: 'generated',

      answer: blankSpec(String(shown)),

        { say: 'Square each one. A negative squared is positive:',
          template: 'd = √( {c} + {d} )', blanks: { c: dx * dx, d: dy * dy } },
        { say: 'Add what is under the radical:',

  // ---- Midpoint. Coordinates of mixed parity land the midpoint on a half,

    var bx = between(rng, -9, 9), by = between(rng, -9, 9);
    if (ax === bx && ay === by) bx += 2;
    var sx = ax + bx, sy = ay + by;

      answer: blankSpec(text),
      verify: function (m) {

        figure: fig,

        steps: [

            template: 'm∠' + C + V + W + ' + m∠' + W + V + A +

      id: 'gen-angadd2-' + A + V + W + C + '-' + a1 + '_' + b1 + '_' + total + '-' + base,
      type: 'angle-addition', source: 'generated',
      prompt: 'm∠' + C + V + W + ' = ' + expr(a1, b1) + ', m∠' + W + V + A +

      figure: fig,
      answer: { kind: 'int', value: x },

    if (f.right) out.push(txt((xm + x1) / 2, y - 32, f.right, 'fmeasure mid'));
    if (f.total) {
      var yb = y + 34;
      out.push('<line x1="' + x0 + '" y1="' + yb + '" x2="' + x1 + '" y2="' + yb +
               '" class="fmeasureline" marker-start="url(#ah)" marker-end="url(#ah)"/>');
      out.push('<line x1="' + x0 + '" y1="' + y + '" x2="' + x0 + '" y2="' + (yb + 6) + '" class="ftick"/>');
      out.push('<line x1="' + x1 + '" y1="' + y + '" x2="' + x1 + '" y2="' + (yb + 6) + '" class="ftick"/>');
      out.push(txt((x0 + x1) / 2, yb + 24, f.total, 'fmeasure mid'));
    }

               ' on a line');
  }

  // ---- Rays from one vertex. Covers naming, classifying, the Angle
  // Addition Postulate and bisectors -- they differ only in labels and arcs.
  var CX = 165, CY = 160, RAY = 118;

  function px(deg, len) { return CX + Math.cos(deg * Math.PI / 180) * len; }

               '" y2="' + r(py(deg, RAY)) + '" class="' + cls +
               '" marker-end="url(#ah)"/>');

        out.push(txt(px(deg, RAY + 16), py(deg, RAY + 16) + 5,

    // angles at the same vertex do not draw on top of each other.
    for (i = 0; i < arcs.length; i++) {

      if (span > 180) { var t = a; a = b; b = t; span = sweep(a, b); }
      var rad = 38 + i * 22;

        // A label sits on the bisector of its arc, so half of it has to fit
        // inside half the arc's angle. On a narrow arc that is only possible
        // further out: at radius r a label of half-width w needs
        // w / tan(span/2) of clearance, or it crosses one of the two rays.
        // "3x + 4" inside a 31 degree angle is the case that forces this.
        var halfWidth = String(arc.label).length * 3.75;
        var halfSpan = Math.max(span, 12) / 2 * Math.PI / 180;
        var needed = halfWidth / Math.tan(halfSpan) + 8;
        // Capped short of the rays themselves, whose own labels sit further
        // out again at RAY + 16.
        var lrad = Math.min(Math.max(rad + 18 + halfWidth, needed), 106);
        out.push(txt(px(midDeg, lrad), py(midDeg, lrad) + 4,
                     arc.label, 'fmeasure mid'));

    if (f.vertex) {
      out.push('<circle cx="' + CX + '" cy="' + CY + '" r="4" class="dot"/>');

  // the picture really is congruent rather than merely captioned that way,
  // and the correspondence has to be read off the marks instead of off the
  // position on the page.

    var dx = q[0] - p[0], dy = q[1] - p[1];
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;      // along the side
    var nx = -uy, ny = ux;                 // across it
    var out = [];
    for (var i = 0; i < n; i++) {
      var off = (i - (n - 1) / 2) * 6;
      var bx = mx + ux * off, by = my + uy * off;
      out.push('<line x1="' + r(bx - nx * 6) + '" y1="' + r(by - ny * 6) +

  }

  function angleArcs(v, a, b, n) {
    function unit(p) {
      var dx = p[0] - v[0], dy = p[1] - v[1];

               ' A ' + rad + ' ' + rad + ' 0 0 0 ' +
               r(v[0] + ub[0] * rad) + ' ' + r(v[1] + ub[1] * rad) +

  function oneTriangle(pts, names) {
    var out = [], i;

    out.push(sideTicks(pts[0], pts[1], 1));
    out.push(sideTicks(pts[0], pts[2], 2));
    out.push(sideTicks(pts[1], pts[2], 3));

    // Angles: vertex 0 one arc, vertex 1 two, vertex 2 three.
    out.push(angleArcs(pts[0], pts[1], pts[2], 1));
    out.push(angleArcs(pts[1], pts[2], pts[0], 2));
    out.push(angleArcs(pts[2], pts[0], pts[1], 3));

    for (i = 0; i < 3; i++) {
      var dx = pts[i][0] - gx, dy = pts[i][1] - gy;
      var l = Math.sqrt(dx * dx + dy * dy) || 1;
      out.push(txt(pts[i][0] + (dx / l) * 18, pts[i][1] + (dy / l) * 18 + 5,

    }

  }

    var W = 380, H = 210;
    var left = place(TRI, 100, 100, 0);
    var right = place(TRI, 275, 100, ROT);

               'Two congruent triangles, ' + f.left.join('') + ' and ' +

    if (!f) return '';

})();

// Targeted feedback for the misconceptions this test invites. Each detector
// recognises a specific wrong value; a wrong answer that matches none of them
// returns '' so the caller stays generic.
//
// Two of these come straight off the completed worksheet: the midpoint
// question was answered with the distance formula, and a bisector question
// was answered by doubling when the two halves were simply equal.
(function () {
  function num(text) {
    var s = String(text).replace(/−/g, '-').trim();
    return /^[+-]?\d+$/.test(s) ? parseInt(s, 10) : null;
  }

  function correctValue(step, blankName) { return step.blanks[blankName]; }

  function letters(text) {
    return String(text).toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  // 1. Adding where the postulate calls for subtracting. The whole is the sum
  //    of the parts, so the missing part is total minus the known one.
  function addedInsteadOfSubtracted(c) {
    var m = c.step.say.match(/Subtract (\d+) from both sides/);
    if (!m) return '';
    var want = num(correctValue(c.step, c.blankName));
    var got = num(c.typed);
    if (want === null || got === null) return '';
    var n = parseInt(m[1], 10);
    if (got !== want + 2 * n) return '';
    return 'The two small pieces add up to the whole, so the missing piece is ' +
           'the whole minus ' + n + ' — subtract it, do not add it.';
  }

  // 2. Squaring a negative and keeping the sign. (−9)² is 81, not −81.
  function negativeSquare(c) {
    if (!/Square each one/i.test(c.step.say)) return '';
    var want = num(correctValue(c.step, c.blankName));
    var got = num(c.typed);
    if (want === null || got === null || got !== -want) return '';
    return 'A negative times a negative is positive, so squaring a negative ' +
           'never leaves a negative. (−' + Math.sqrt(Math.abs(want)) +
           ')² is ' + Math.abs(want) + '.';
  }

  // 3. Stopping at the radicand. The worksheet's own distance question ends
  //    √225 = 15, and 225 is the tempting thing to write down.
  function forgotTheRoot(c) {
    if (!/Take the square root/i.test(c.step.say)) return '';
    var want = num(correctValue(c.step, c.blankName));
    var got = num(c.typed);
    if (want === null || got === null) return '';
    if (got !== want * want) return '';
    return 'That is what is under the radical, not the distance. ' +
           'Take the square root of ' + got + '.';
  }

  // 4. The midpoint answered without the halving step -- the sums, not the
  //    averages.
  function midpointNotHalved(c) {
    if (c.problem.type !== 'midpoint') return '';
    var sums = c.problem.steps[0].blanks;
    var typedPair = String(c.typed).replace(/[()\s]/g, '').replace(/−/g, '-');
    var want = String(sums.a) + ',' + String(sums.b);
    if (typedPair !== want) return '';
    return 'Those are the two sums. The midpoint is the AVERAGE of each pair ' +
           'of coordinates, so each sum still has to be divided by 2.';
  }

  // 5. The bisector mistakes. There are three directions and each has its own
  //    wrong answer, so the detector reads `problem.ask` rather than guessing:
  //    doubling when the halves are simply equal, handing back a half when the
  //    whole was wanted, and copying the whole across when a half was wanted.
  //    Part I sets up the first two; Part II #11a sets up the third.
  function bisectorHalving(c) {
    if (c.problem.type !== 'bisector') return '';
    var want = num(correctValue(c.step, c.blankName));
    var got = num(c.typed);
    if (want === null || got === null) return '';

    if (c.problem.ask === 'whole' && got * 2 === want) {
      return 'That is one half. The question asks for the whole angle, which ' +
             'is both halves together.';
    }
    if (c.problem.ask === 'other-half' && got === want * 2) {
      return 'A bisector makes two EQUAL halves, so the other half is the ' +
             'same measure — nothing gets doubled here. Doubling gives the ' +
             'whole angle, which is not what was asked.';
    }
    if (c.problem.ask === 'half' && got === want * 2) {
      return 'That is the whole angle you were given, not a half of it. ' +
             'The bisector splits it in two, so this one divides by 2 — it is ' +
             'the opposite of the doubling question.';
    }
    return '';
  }

  // 6. Naming an angle with the vertex out of position. The right letters in
  //    the wrong order is a different angle, not a spelling slip.
  function vertexNotInMiddle(c) {
    if (c.problem.type !== 'angle-naming') return '';
    var want = letters(correctValue(c.step, c.blankName));
    var got = letters(c.typed);
    if (want.length !== 3 || got.length !== 3) return '';
    if (got === want) return '';
    if (got.split('').sort().join('') !== want.split('').sort().join('')) return '';
    var vertex = want.charAt(1);
    if (got.charAt(1) === vertex) return '';
    return 'Right three letters, wrong order. The vertex goes in the MIDDLE, ' +
           'so ' + vertex + ' belongs between the other two.';
  }

  // 7. A congruency statement matched to the wrong vertex of the other
  //    triangle. The marks give the pairing; position on the page does not.
  function wrongCorrespondence(c) {
    if (c.problem.type !== 'congruence') return '';
    var f = c.problem.figure;
    if (!f || !f.right) return '';
    var want = letters(correctValue(c.step, c.blankName));
    var got = letters(c.typed);
    if (got === '' || got === want || got.length !== want.length) return '';
    for (var i = 0; i < got.length; i++) {
      if (f.right.indexOf(got.charAt(i)) === -1) return '';
    }
    return 'Those letters are from the right triangle, but they are not the ' +
           'matching ones. Count the tick marks and arcs — equal marks pair ' +
           'up, wherever the triangle happens to sit on the page.';
  }

  var DETECTORS = [addedInsteadOfSubtracted, negativeSquare, forgotTheRoot,
                   midpointNotHalved, bisectorHalving, vertexNotInMiddle,
                   wrongCorrespondence];

  function hintFor(context) {
    for (var i = 0; i < DETECTORS.length; i++) {
      var h = DETECTORS[i](context);
      if (h) return h;
    }
    return '';
  }

  globalThis.hintFor = hintFor;
})();

// Per-topic mastery streaks and cross-session trouble spots.
// Pure: takes and returns plain objects, never touches localStorage itself.
(function () {
  var VERSION = 1;
  var STORAGE_KEY = 'study-time.geometry-10-t2.progress';

  function empty() { return { version: VERSION, mastery: {}, misses: {} }; }

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !(v instanceof Array);
  }

  // Anything unexpected yields a fresh record. A study tool losing history is
  // a nuisance; a study tool refusing to start is a broken evening.
  function parseProgress(json) {
    if (!json) return empty();
    var data;
    try { data = JSON.parse(json); } catch (e) { return empty(); }
    if (!isPlainObject(data)) return empty();
    if (data.version !== VERSION) return empty();
    return {
      version: VERSION,
      mastery: isPlainObject(data.mastery) ? data.mastery : {},
      misses: isPlainObject(data.misses) ? data.misses : {}
    };
  }

  function copy(obj) {
    var out = {};
    for (var k in obj) { if (obj.hasOwnProperty(k)) out[k] = obj[k]; }
    return out;
  }

  function recordResult(progress, type, problemId, firstTryCorrect) {
    var mastery = copy(progress.mastery);
    var misses = copy(progress.misses);
    if (firstTryCorrect) {
      mastery[type] = (mastery[type] || 0) + 1;
    } else {
      mastery[type] = 0;
      misses[type] = (misses[type] || 0) + 1;
    }
    return { version: VERSION, mastery: mastery, misses: misses };
  }

  function masteryStreak(progress, type) { return progress.mastery[type] || 0; }

  function troubleSpots(progress) {
    var out = [];
    for (var type in progress.misses) {
      if (progress.misses.hasOwnProperty(type) && progress.misses[type] > 0) {
        out.push({ type: type, misses: progress.misses[type] });
      }
    }
    out.sort(function (a, b) {
      return b.misses - a.misses || (a.type < b.type ? -1 : 1);
    });
    return out;
  }

  function serializeProgress(progress) { return JSON.stringify(progress); }

  globalThis.STORAGE_KEY = STORAGE_KEY;
  globalThis.parseProgress = parseProgress;
  globalThis.recordResult = recordResult;
  globalThis.masteryStreak = masteryStreak;
  globalThis.troubleSpots = troubleSpots;
  globalThis.serializeProgress = serializeProgress;
})();

// Drill and mock-test sequencing. Owns attempt counting and scoring.
// Copied from geometry-10; only MOCK_MIX differs.
// No DOM access.
(function () {
  var MASTERY_TARGET = 4;

  // Proportioned like the two study guides together. Vocabulary is a separate
  // tool, so this mix is the problem half of the test only. Bisectors carry
  // three questions because they now come in three directions -- double a
  // half, halve the whole, or copy the equal other half -- and one of each is
  // the point.
  var MOCK_MIX = [
    { type: 'segment-addition', count: 2 },
    { type: 'distance', count: 2 },
    { type: 'midpoint', count: 2 },
    { type: 'angle-naming', count: 2 },
    { type: 'angle-classify', count: 4 },
    { type: 'congruence', count: 1 },
    { type: 'angle-addition', count: 4 },
    { type: 'bisector', count: 3 }
  ];

  function blankNames(step) { return Object.keys(step.blanks); }

  // Display-only steps carry no blanks and are skipped when advancing.
  function firstAnswerable(problem, from) {
    for (var i = from; i < problem.steps.length; i++) {
      if (blankNames(problem.steps[i]).length > 0) return i;
    }
    return -1;
  }

  function createSession(config) {
    var queue = config.queue;          // array of problem objects
    var isDrill = config.isDrill;
    var type = config.type;
    var nextProblem = config.nextProblem;  // function or null

    var problem = null, stepIndex = -1, blankIdx = 0;
    var attempts = 0, revealed = false;
    var cleanProblem = true;
    var streak = 0, solved = 0, score = 0;
    var missed = [];
    var results = [];
    var done = false;

    // A problem whose every step is display-only has nothing to ask, so it is
    // skipped rather than finished -- it must not reach results(). The cap
    // keeps a generator that only ever yields such problems from spinning
    // forever; it surfaces as a finished session instead of a hang.
    function loadNext() {
      for (var tries = 0; tries < 50; tries++) {
        var p = queue.length ? queue.shift() : (nextProblem ? nextProblem() : null);
        if (!p) { done = true; problem = null; return; }
        problem = p;
        stepIndex = firstAnswerable(p, 0);
        blankIdx = 0; attempts = 0; revealed = false; cleanProblem = true;
        if (stepIndex !== -1) return;
      }
      done = true; problem = null;
    }

    function currentStep() { return problem.steps[stepIndex]; }
    function currentBlank() { return blankNames(currentStep())[blankIdx]; }

    function finishProblem() {
      solved += 1;
      results.push({ type: problem.type, problemId: problem.id, clean: cleanProblem });
      if (cleanProblem) { score += 1; streak += 1; } else { streak = 0; }
      if (isDrill && streak >= MASTERY_TARGET) { done = true; problem = null; return; }
      loadNext();
    }

    function advanceBlank() {
      attempts = 0; revealed = false;
      var names = blankNames(currentStep());
      if (blankIdx + 1 < names.length) { blankIdx += 1; return; }
      var next = firstAnswerable(problem, stepIndex + 1);
      if (next === -1) { finishProblem(); return; }
      stepIndex = next; blankIdx = 0;
    }

    function submit(text) {
      if (done || problem === null) {
        return { status: 'done', hint: '', revealed: false, advanced: false, complete: true };
      }
      var step = currentStep();
      var name = currentBlank();
      var spec = blankSpec(step.blanks[name]);
      var result = checkAnswer(text, spec);

      // Neither of these is a real attempt: the first has the right value and
      // the second has no value at all.
      if (result.status === 'unreduced' || result.status === 'malformed') {
        return { status: result.status, hint: '', revealed: false,
                 advanced: false, complete: false };
      }

      if (result.status === 'correct') {
        advanceBlank();
        return { status: 'correct', hint: '', revealed: false,
                 advanced: true, complete: done };
      }

      attempts += 1;
      cleanProblem = false;
      if (attempts === 1) {
        var hint = hintFor({ problem: problem, step: step,
                             blankName: name, typed: text });
        return { status: 'wrong', hint: hint, revealed: false,
                 advanced: false, complete: false };
      }
      var shown = String(step.blanks[name]);
      missed.push({ problem: problem, blankName: name });
      advanceBlank();
      return { status: 'revealed', hint: 'The answer is ' + shown + '.',
               revealed: true, advanced: true, complete: done };
    }

    function current() {
      if (done || problem === null) return null;
      return { problem: problem, stepIndex: stepIndex,
               blankName: currentBlank(), revealed: revealed };
    }

    function progressText() {
      if (isDrill) {
        return 'Problem ' + (solved + 1) + ' · streak ' + streak +
               ' of ' + MASTERY_TARGET;
      }
      return 'Question ' + Math.min(solved + 1, config.total) +
             ' of ' + config.total;
    }

    loadNext();

    return {
      current: current, submit: submit, progressText: progressText,
      isDone: function () { return done; },
      score: function () { return score; },
      missed: function () { return missed.slice(); },
      results: function () { return results.slice(); },
      type: function () { return type; }
    };
  }

  function createDrill(type, options) {
    var opts = options || {};
    var rng = opts.rng || makeRng(Math.floor(Math.random() * 1e9));
    var authored = opts.problems || PROBLEMS.filter(function (p) {
      return p.type === type;
    });
    // Authored problems first, then generated variants forever, so repeated
    // drilling cannot decay into memorising the study guide.
    return createSession({
      queue: authored.slice(), isDrill: true, type: type,
      nextProblem: function () { return generate(type, rng); }
    });
  }

  function createMockTest(options) {
    var opts = options || {};
    var rng = opts.rng || makeRng(Math.floor(Math.random() * 1e9));
    var queue = [];
    for (var i = 0; i < MOCK_MIX.length; i++) {
      for (var n = 0; n < MOCK_MIX[i].count; n++) {
        queue.push(generate(MOCK_MIX[i].type, rng));
      }
    }
    return createSession({
      queue: queue, isDrill: false, type: 'mixed',
      nextProblem: null, total: queue.length
    });
  }

  globalThis.MASTERY_TARGET = MASTERY_TARGET;
  globalThis.MOCK_MIX = MOCK_MIX;
  globalThis.createDrill = createDrill;
  globalThis.createMockTest = createMockTest;
})();

  function placeholderFor(spec) { return SHAPE[spec.kind] || ''; }

  // "Type an answer first" is only true of an empty box. If something was
  // typed and could not be read, say what shape was expected instead.
  var SHAPE_HELP = {
    'pair': 'Give it as an ordered pair, like (3, 0).',
    'fraction': 'Write it as a fraction, like 3/4.',
    'radical': 'Write it in exact form, like 5\u221a10.',
    'decimal2': 'Give a decimal to the hundredths place, like 5.92.',
    'decimal3': 'Give a decimal to the thousandths place, like 11.402.',
    'op': 'Write the operation, like +5 or \u00f73.',
    'signs': 'Give the two signs, like +,\u2212.',
    'segment': 'Name the segment by its two endpoints, like AB.',
    'angle': 'Name the angle, like \u2220ABC or \u22203.',
    'int': 'That does not look like a number.'
  };
  function malformedMessage(spec, typed) {
    if (String(typed).trim() === '') return 'Type an answer first.';
    return SHAPE_HELP[spec.kind] || 'That answer could not be read.';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Blanks before the active one show what was entered; the active one is an
  // input; later ones are dimmed placeholders.
  function renderTemplate(template, blanks, activeName, filled) {
    return template.replace(/\{(\w+)\}/g, function (_, name) {
      if (name === activeName) {
        var ph = placeholderFor(blankSpec(blanks[name]));
        return '<input id="answer" type="text" inputmode="text" ' +
               'spellcheck="false" autocomplete="off" autocorrect="off" ' +
               'autocapitalize="off" aria-label="Answer"' +
               (ph ? ' placeholder="' + ph + '"' : '') + '>';
      }
      if (filled && filled.hasOwnProperty(name)) {
        var cls = filled[name].shown ? 'shown' : 'filled';
        return '<span class="' + cls + '">' +
               escapeHtml(filled[name].text) + '</span>';
      }
      return '<span class="todo">___</span>';
    });
  }

  // The answer key writes the operation under each side with a rule beneath,
  // then the new equation. Steps that only rewrite ("Distribute the 2") carry
  // no opL/opR and get no row.
  function renderOpRow(step, activeName, filled) {
    if (!step.blanks.hasOwnProperty('opL')) return '';
    function cell(name) {
      return '<span class="opcell">' +
             renderTemplate('{' + name + '}', step.blanks, activeName, filled) +
             '</span>';
    }
    return '<div class="oprow">' + cell('opL') + cell('opR') + '</div>' +
           '<div class="oprule"></div>';
  }

  var session = null, progress = null, filledByStep = {};

  function loadProgress() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    return parseProgress(raw);
  }

  function saveProgress(p) {
    try { localStorage.setItem(STORAGE_KEY, serializeProgress(p)); }
    catch (e) { /* private browsing: progress simply will not persist */ }
  }

  function renderMenu() {
    progress = loadProgress();
    var list = el('topic-list');
    list.innerHTML = '';
    for (var i = 0; i < TYPES.length; i++) {
      (function (type) {
        var streak = masteryStreak(progress, type);
        var pct = Math.min(100, (streak / MASTERY_TARGET) * 100);
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.innerHTML = '<span>' + escapeHtml(LABELS[type]) + '</span>' +
                      '<span class="bar"><i style="width:' + pct + '%"></i></span>';
        b.onclick = function () { begin(createDrill(type)); };
        li.appendChild(b); list.appendChild(li);
      })(TYPES[i]);
    }
    var spots = troubleSpots(progress);
    show('trouble', spots.length > 0);
    var tl = el('trouble-list');
    tl.innerHTML = '';
    for (var s = 0; s < spots.length; s++) {
      var li2 = document.createElement('li');
      li2.textContent = LABELS[spots[s].type] + ' — missed ' +
                        spots[s].misses + (spots[s].misses === 1 ? ' time' : ' times');
      tl.appendChild(li2);
    }
    show('menu-screen', true); show('quiz-screen', false); show('done-screen', false);
  }

  function begin(s) {
    session = s; filledByStep = {};
    show('menu-screen', false); show('done-screen', false); show('quiz-screen', true);
    renderQuiz('');
  }

  function renderQuiz(feedback, tone) {
    var cur = session.current();
    if (cur === null) { renderDone(); return; }
    var p = cur.problem;

    el('progress').textContent = session.progressText();
    el('prompt').innerHTML = escapeHtml(p.prompt);

    var note = '';
    if (p.type === 'distance') note = 'Round to the nearest thousandth only if it does not come out exact.';
    if (p.type === 'congruence') note = 'Equal tick marks pair the sides; equal arcs pair the angles.';
    if (p.type === 'angle-classify') note = 'Assume the angle is drawn to scale.';
    el('calc-note').textContent = note;
    show('calc-note', note !== '');

    el('figure').innerHTML = p.figure ? renderFigure(p.figure) : '';

    var ol = el('steps');
    ol.innerHTML = '';
    // Only steps already reached are rendered at all. Listing the remaining
    // instructions would hand over the method, and choosing the next
    // operation is itself what the test asks for.
    for (var i = 0; i <= cur.stepIndex && i < p.steps.length; i++) {
      var step = p.steps[i];
      var li = document.createElement('li');
      li.className = i < cur.stepIndex ? 'past' : 'active';
      var active = (i === cur.stepIndex) ? cur.blankName : null;
      var filled = filledByStep[i] || {};
      li.innerHTML = '<div class="say">' + escapeHtml(step.say) + '</div>' +
                     renderOpRow(step, active, filled) +
                     '<div class="line">' +
                     renderTemplate(step.template, step.blanks, active, filled) +
                     '</div>';
      ol.appendChild(li);
    }
    if (cur.stepIndex + 1 < p.steps.length) {
      var more = document.createElement('li');
      more.className = 'more';
      more.textContent = 'next step appears when this one is right';
      ol.appendChild(more);
    }

    var fb = el('feedback');
    fb.textContent = feedback || '';
    fb.className = tone || '';

    var input = el('answer');
    var check = el('check');
    if (input) {
      input.focus();
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); onSubmit(input.value); }
      };
      // Enter alone is fine on a laptop, but there is no comfortable Enter
      // key on a tablet.
      check.onclick = function () { onSubmit(input.value); };
    }
    show('controls', input !== null);
  }

  function onSubmit(text) {
    var cur = session.current();
    if (!cur) return;
    var stepIndex = cur.stepIndex, name = cur.blankName;
    var result = session.submit(text);

    if (result.status === 'unreduced') {
      renderQuiz('Right value — now simplify it completely.', 'bad'); return;
    }
    if (result.status === 'needs-hundredths' || result.status === 'needs-thousandths') {
      var places = result.status === 'needs-hundredths' ? 'hundredths' : 'thousandths';
      renderQuiz('Round it to the ' + places + ' place — that many digits exactly.', 'bad');
      return;
    }
    if (result.status === 'malformed') {
      var spec = blankSpec(cur.problem.steps[stepIndex].blanks[name]);
      renderQuiz(malformedMessage(spec, text), 'bad'); return;
    }
    if (result.status === 'correct' || result.status === 'revealed') {
      filledByStep[stepIndex] = filledByStep[stepIndex] || {};
      filledByStep[stepIndex][name] = {
        text: result.status === 'revealed'
              ? String(cur.problem.steps[stepIndex].blanks[name]) : text,
        shown: result.status === 'revealed'
      };
    }
    if (result.status === 'correct') {
      if (session.current() && session.current().problem !== cur.problem) {
        filledByStep = {};
      }
      renderQuiz('', 'good'); return;
    }
    if (result.status === 'wrong') {
      renderQuiz(result.hint || 'Not quite — try that step again.', 'bad'); return;
    }
    if (result.status === 'revealed') {
      if (session.current() && session.current().problem !== cur.problem) {
        filledByStep = {};
      }
      renderQuiz(result.hint, 'bad'); return;
    }
    renderDone();
  }

  function renderDone() {
    progress = loadProgress();
    var missed = session.missed();
    var seen = {};
    for (var i = 0; i < missed.length; i++) { seen[missed[i].problem.id] = missed[i].problem; }
    // Replay each finished problem so the stored streak matches the one the
    // session used, instead of collapsing a whole session into one result.
    var finished = session.results();
    for (var r = 0; r < finished.length; r++) {
      progress = recordResult(progress, finished[r].type,
                              finished[r].problemId, finished[r].clean);
    }
    saveProgress(progress);

    el('done-title').textContent = missed.length === 0 ? 'Clean sweep' : 'Session complete';
    el('done-score').textContent = 'Score: ' + session.score();
    var rl = el('review-list');
    rl.innerHTML = '';
    for (var id in seen) {
      if (seen.hasOwnProperty(id)) {
        var li = document.createElement('li');
        li.textContent = seen[id].prompt + '  →  ' + describeAnswer(seen[id].answer);
        rl.appendChild(li);
      }
    }
    show('quiz-screen', false); show('done-screen', true);
  }

  function describeAnswer(a) {
    if (a.kind === 'fraction') return a.num + '/' + a.den;
    if (a.kind === 'radical') return (a.coef === 1 ? '' : a.coef) + '√' + a.rad;
    // Pair components are fractions now, because a midpoint lands on halves.
    if (a.kind === 'pair') {
      return '(' + fractionText(a.x) + ', ' + fractionText(a.y) + ')';
    }
    if (a.kind === 'signs') return '(' + a.x + ', ' + a.y + ')';
    return String(a.value);
  }

  function startApp() {
    el('start-mock').onclick = function () { begin(createMockTest()); };
    el('back-to-menu').onclick = function (e) { e.preventDefault(); renderMenu(); };
    el('again').onclick = function () { renderMenu(); };
    renderMenu();
  }

  globalThis.renderTemplate = renderTemplate;
  globalThis.startApp = startApp;
})();

document.addEventListener('DOMContentLoaded', function () { startApp(); });
</script>
</body>
</html>
