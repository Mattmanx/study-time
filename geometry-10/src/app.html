<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry — Test #1: Algebra Review</title>
<!-- Applies a saved theme before first paint. This cannot live in the
     manifest: build.py puts all module JS at the end of <body>, and setting
     the theme there means every load flashes the other palette first --
     which is worst for exactly the reader who chose light on a dark OS.
     The key must match THEME_STORAGE_KEY in shared/theme/theme.js. -->
<script>try{var t=localStorage.getItem('study-time.theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>{{CSS}}</style>
</head>
<body>
<main id="menu-screen">
  <p class="crumb"><a href="../index.html">← All topics</a></p>
  <h1>Test #1: Algebra Review</h1>
  <h2>Drill one topic</h2>
  <ul id="topic-list" class="topics"></ul>
  <h2>Or take a practice test</h2>
  <button id="start-mock" class="primary">Start practice test</button>
  <section id="trouble" hidden>
    <h2>Worth reviewing</h2>
    <ul id="trouble-list"></ul>
  </section>
</main>

<main id="quiz-screen" hidden>
  <p class="crumb"><a href="#" id="back-to-menu">← Menu</a></p>
  <p id="progress"></p>
  <p id="calc-note" class="note" hidden></p>
  <div id="figure"></div>
  <p id="prompt" class="prompt"></p>
  <ol id="steps"></ol>
  <div id="controls"><button id="check" class="primary">Check</button></div>
  <p id="feedback" aria-live="polite"></p>
</main>

<main id="done-screen" hidden>
  <h1 id="done-title"></h1>
  <p id="done-score"></p>
  <section>
    <h2>Review these</h2>
    <ul id="review-list"></ul>
  </section>
  <button id="again" class="primary">Back to menu</button>
</main>
<script>{{JS}}</script>
</body>
</html>
